<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Rekap surat tugas dan bukti perjalanan dinas.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rekap Perjadin">
  <title>Rekap Perjadin</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- ===== LAYAR SETUP ===== -->
  <section id="setup" class="setup hidden">
    <div class="setup-card glass">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5Z"/></svg>
      </div>
      <h1>Rekap Perjadin</h1>
      <p class="muted">Hubungkan aplikasi ke spreadsheet rekap perjalanan dinas. Cukup sekali di perangkat ini.</p>
      <form id="setupForm" autocomplete="off">
        <label class="field"><span>URL Web App</span>
          <input id="setupUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" required></label>
        <label class="field"><span>Token rahasia</span>
          <input id="setupToken" type="password" placeholder="Tempel token dari Apps Script" required></label>
        <p id="setupErr" class="form-err"></p>
        <button class="btn btn-primary btn-block" type="submit" id="setupBtn">Hubungkan</button>
      </form>
    </div>
  </section>

  <!-- ===== APLIKASI ===== -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div>
        <p class="topbar-sub" id="topSub"></p>
        <h1 class="topbar-title" id="topTitle">Beranda</h1>
      </div>
      <button class="icon-btn" id="btnSync" aria-label="Sinkronkan">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9M18 3v4.5h-4.5M6 21v-4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="dot-pending hidden" id="dotPending"></span>
      </button>
    </header>

    <div id="offlineBar" class="offline-bar hidden">Sedang offline. Data terakhir tetap bisa dilihat; unggah & simpan butuh internet.</div>

    <main>
      <section class="view" id="view-beranda"></section>
      <section class="view hidden" id="view-daftar"></section>
      <section class="view hidden" id="view-rekap"></section>
      <section class="view hidden" id="view-atur"></section>
    </main>

    <nav class="bottom-nav glass" aria-label="Navigasi utama">
      <button class="nav-item active" data-view="beranda">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
        <span>Beranda</span>
      </button>
      <button class="nav-item" data-view="daftar">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Perjadin</span>
      </button>
      <div class="nav-fab-slot">
        <button class="fab" id="fab" aria-label="Upload surat tugas">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="nav-item" data-view="rekap">
        <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm7 0v5h5M9 13h6M9 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Rekap</span>
      </button>
      <button class="nav-item" data-view="atur">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Atur</span>
      </button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  <div id="dialog" class="dialog-wrap hidden" role="alertdialog" aria-modal="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="printArea"></div>

  <script src="app.js" defer></script>
</body>
</html>
